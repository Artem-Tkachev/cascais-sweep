<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascais — брошенные самокаты (черновик)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --panel:#ffffffee; --line:#e3e3e8; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; top:12px; left:12px; width:320px; max-width:calc(100% - 24px);
           background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
           box-shadow:0 4px 18px #0002; }
  h1 { font-size:16px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:12px; }
  .big { font-size:32px; font-weight:700; margin:8px 0 0; }
  input[type=range] { width:100%; margin:10px 0 4px; }
  .row { display:flex; gap:8px; align-items:center; }
  button { border:1px solid var(--line); background:#f5f5f7; border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 4px 0 10px; vertical-align:middle; }
  .legend span:first-child { margin-left:0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Брошенные самокаты · Cascais</h1>
  <div class="muted">Вне 30 м от станции дольше 2 часов</div>
  <div class="big" id="count">–</div>
  <div class="muted">брошено в этот момент</div>
  <input type="range" id="t">
  <div class="row"><button id="play">▶ Play</button><b id="when"></b></div>
  <div class="legend muted" style="margin-top:10px">
    <span style="background:#f2c230"></span>2–4 ч
    <span style="background:#f07d1b"></span>4–8 ч
    <span style="background:#d7263d"></span>8+ ч
    <span style="background:#2f6fdf;border-radius:2px"></span>станция
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/data.js"></script>
<script>
const AB = window.ABANDONED.map(d => ({...d,
  t0: Date.parse(d.abandoned_from), t1: Date.parse(d.end), ts: Date.parse(d.start)}));
const map = L.map('map', { preferCanvas:true }).setView([38.70, -9.40], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  { attribution:'© OpenStreetMap © CARTO', maxZoom:20 }).addTo(map);

// станции
L.geoJSON(window.STATIONS, { style:{ color:'#2f6fdf', weight:1, fillOpacity:0.35 } })
  .bindTooltip(l => l.feature.properties.name).addTo(map);
for (const f of window.STATIONS.features)          // центр станции — чтобы видно было на любом масштабе
  L.circleMarker([f.properties.lat, f.properties.lon], { radius:3, color:'#2f6fdf', weight:1, fillOpacity:0.9 })
    .bindTooltip(f.properties.name).addTo(map);

const layer = L.layerGroup().addTo(map);
const color = h => h >= 8 ? '#d7263d' : h >= 4 ? '#f07d1b' : '#f2c230';

const tMin = Math.min(...AB.map(d => d.t0)), tMax = Math.max(...AB.map(d => d.t1));
const STEP = 15 * 60 * 1000;
const slider = document.getElementById('t');
slider.min = 0; slider.max = Math.floor((tMax - tMin) / STEP); slider.value = Math.floor(slider.max * 0.2);

function render() {
  const t = tMin + slider.value * STEP;
  layer.clearLayers();
  let n = 0;
  for (const d of AB) {
    if (d.t0 <= t && d.t1 > t) {
      n++;
      const h = (t - d.ts) / 3.6e6;             // сколько уже стоит (с момента парковки)
      L.circleMarker([d.lat, d.lng], { radius:7, color:'#fff', weight:1.5, fillColor:color(h), fillOpacity:0.95 })
        .bindTooltip(`Стоит ${h.toFixed(1)} ч<br>${Math.round(d.dist_to_station_m)} м от станции<br>батарея ${Math.round((d.battery||0)*100)}%`)
        .addTo(layer);
    }
  }
  document.getElementById('count').textContent = n;
  document.getElementById('when').textContent = new Date(t).toLocaleString('ru-RU',
    { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
slider.oninput = render;
let timer = null;
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ Play'; return; }
  e.target.textContent = '⏸ Pause';
  timer = setInterval(() => { slider.value = (+slider.value + 1) % (+slider.max + 1); render(); }, 150);
};
render();
</script>
</body>
</html>
